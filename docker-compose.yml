version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flor
      POSTGRES_PASSWORD: flor
      POSTGRES_DB: flor_de_menina
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flor']
      interval: 5s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev
    ports:
      - '1080:1080'
      - '1025:1025'
    restart: unless-stopped

  # Se a porta 6379 já estiver ocupada (Redis nativo no Windows), ignore o erro —
  # postgres e maildev sobem normalmente e a API usa o Redis nativo.
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
